<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇰🇷 韓文單詞多媒體測驗系統</title>
  
  <!-- 引入 p5.js 核心庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  
  <!-- 引入 p5.js DOM 庫 (按鈕與 UI 必備) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/addons/p5.dom.js"></script>

  <style>
    /* 消除預設邊距與邊框，保持全螢幕畫布響應式體驗 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 防止捲軸出現 */
      background-color: #fff8f5; /* 溫馨韓系奶油白背景 */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none; /* 防止拖曳文字時選取到藍色文字區塊 */
    }

    /* 讓 HTML 按鈕點擊時有更平滑的微動效果 */
    button {
      transition: all 0.2s ease-in-out;
    }
    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <!-- 引入主程式腳本 (請確保 sketch.js 與 index.html 在同一資料夾內) -->
  <script src="sketch.js"></script>

</body>
</html>
